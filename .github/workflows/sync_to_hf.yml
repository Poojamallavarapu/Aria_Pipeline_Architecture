name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: ShoheiYokoyama/github-action-sync-to-huggingface@v0.1.2
        with:
          object-type: 'space'
          space-id: 'miniorange/aria-cybersecurity'
          hf-token: ${{ secrets.HF_TOKEN }}
